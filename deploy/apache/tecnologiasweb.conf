# Publica los puntos de entrada y recursos sin exponer el codigo interno.
Alias /TecnologiasWeb/php/usuarios/ /var/www/html/TecnologiasWeb/usuarios/
Alias /TecnologiasWeb/php/css/ /var/www/html/TecnologiasWeb/css/
Alias /TecnologiasWeb/php/js/ /var/www/html/TecnologiasWeb/js/
Alias /TecnologiasWeb/php/ /var/www/html/TecnologiasWeb/php/

<Directory /var/www/html/TecnologiasWeb>
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/html/TecnologiasWeb/php>
    Options -Indexes
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory /var/www/html/TecnologiasWeb/usuarios>
    Options -Indexes
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory /var/www/html/TecnologiasWeb/css>
    Options -Indexes
    Require all granted
</Directory>

<Directory /var/www/html/TecnologiasWeb/js>
    Options -Indexes
    Require all granted
</Directory>
