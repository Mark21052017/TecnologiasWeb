# Publica los puntos de entrada y recursos sin exponer el codigo interno.
Alias /TecnologiasWeb/php/usuarios/ /var/www/html/TecnologiasWeb/usuarios/
Alias /TecnologiasWeb/php/css/ /var/www/html/TecnologiasWeb/css/
Alias /TecnologiasWeb/php/js/ /var/www/html/TecnologiasWeb/js/
Alias /TecnologiasWeb/php/img/ /var/www/html/TecnologiasWeb/img/
AliasMatch ^/TecnologiasWeb/php/perfil-tutor/?$ /var/www/html/TecnologiasWeb/php/catalogo/perfil-tutor.php
Alias /TecnologiasWeb/php/ /var/www/html/TecnologiasWeb/php/
Alias /TecnologiasWeb/php/periodos/ /var/www/html/TecnologiasWeb/php/periodos/
Alias /TecnologiasWeb/php/turnos/ /var/www/html/TecnologiasWeb/php/turnos/
Alias /TecnologiasWeb/php/aulas/ /var/www/html/TecnologiasWeb/php/aulas/
Alias /TecnologiasWeb/php/ofertas/ /var/www/html/TecnologiasWeb/php/ofertas/
Alias /TecnologiasWeb/php/solicitudes-tutor/ /var/www/html/TecnologiasWeb/php/solicitudes-tutor/
Alias /TecnologiasWeb/php/solicitudes/ /var/www/html/TecnologiasWeb/php/solicitudes/
Alias /TecnologiasWeb/php/inscripciones/ /var/www/html/TecnologiasWeb/php/inscripciones/
Alias /TecnologiasWeb/php/modalidades-grado/ /var/www/html/TecnologiasWeb/php/mg/
Alias /TecnologiasWeb/php/mi-perfil/ /var/www/html/TecnologiasWeb/php/perfil/
AliasMatch ^/TecnologiasWeb/php/mi-perfil$ /var/www/html/TecnologiasWeb/php/perfil/index.php
AliasMatch ^/TecnologiasWeb/php/mi-perfil-tutor/?$ /var/www/html/TecnologiasWeb/php/tutor/mi_perfil.php
AliasMatch ^/TecnologiasWeb/php/materias-ofertadas/?$ /var/www/html/TecnologiasWeb/php/tutor/mis_materias.php
AliasMatch ^/TecnologiasWeb/php/materias-ofertadas/seleccionar\.php$ /var/www/html/TecnologiasWeb/php/tutor/mis_materias/aplicar.php
AliasMatch ^/TecnologiasWeb/php/materias-ofertadas/horarios\.php$ /var/www/html/TecnologiasWeb/php/tutor/mis_materias/horarios.php
AliasMatch ^/TecnologiasWeb/php/materias-ofertadas/cancelar\.php$ /var/www/html/TecnologiasWeb/php/tutor/mis_materias/cancelar.php
AliasMatch ^/TecnologiasWeb/php/materias-ofertadas/cancelar\.php$ /var/www/html/TecnologiasWeb/php/tutor/mis_materias/cancelar.php
AliasMatch ^/TecnologiasWeb/php/modalidades-grado/?$ /var/www/html/TecnologiasWeb/php/mg/index.php
AliasMatch ^/TecnologiasWeb/php/solicitudes/?$ /var/www/html/TecnologiasWeb/php/solicitudes/index.php

<Directory /var/www/html/TecnologiasWeb>
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/html/TecnologiasWeb/php>
    Options -Indexes
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory /var/www/html/TecnologiasWeb/usuarios>
    Options -Indexes
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory /var/www/html/TecnologiasWeb/css>
    Options -Indexes
    Require all granted
</Directory>

<Directory /var/www/html/TecnologiasWeb/js>
    Options -Indexes
    Require all granted
</Directory>

<Directory /var/www/html/TecnologiasWeb/img>
    Options -Indexes
    Require all granted
</Directory>
