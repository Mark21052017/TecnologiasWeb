# Publica solo la carpeta public y conserva fuera del acceso web app/database.
Alias /TecnologiasWeb/php/ /var/www/html/TecnologiasWeb/php/public/

<Directory /var/www/html/TecnologiasWeb/php/public>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>
