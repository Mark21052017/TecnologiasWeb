ServerName localhost

DocumentRoot /var/www/html

# Public entry points and friendly application routes.
AliasMatch ^/$ /var/www/html/php/index.php
AliasMatch ^/(index\.php|login\.php|register\.php|postular-tutor\.php|logout\.php|dashboard\.php)$ /var/www/html/php/$1

Alias /usuarios/ /var/www/html/usuarios/
Alias /roles/ /var/www/html/php/roles/
Alias /carreras/ /var/www/html/php/carreras/
Alias /materias/ /var/www/html/php/materias/
Alias /tipos-tutoria/ /var/www/html/php/tipos-tutoria/
Alias /estudiantes/ /var/www/html/php/estudiantes/
Alias /tutores/ /var/www/html/php/tutores/
Alias /asignaciones/ /var/www/html/php/asignaciones/
Alias /disponibilidad/ /var/www/html/php/disponibilidad/
Alias /tutorias/ /var/www/html/php/tutorias/
Alias /evaluaciones/ /var/www/html/php/evaluaciones/
Alias /accesos/ /var/www/html/php/accesos/
Alias /permisos/ /var/www/html/php/permisos/
Alias /tutor/ /var/www/html/php/tutor/
Alias /periodos/ /var/www/html/php/periodos/
Alias /turnos/ /var/www/html/php/turnos/
Alias /aulas/ /var/www/html/php/aulas/
Alias /ofertas/ /var/www/html/php/ofertas/
Alias /solicitudes-tutor/ /var/www/html/php/solicitudes-tutor/
Alias /solicitudes/ /var/www/html/php/solicitudes/
Alias /inscripciones/ /var/www/html/php/inscripciones/
Alias /modalidades-grado/ /var/www/html/php/mg/
Alias /mi-perfil/ /var/www/html/php/perfil/
Alias /css/ /var/www/html/css/
Alias /js/ /var/www/html/js/
Alias /img/ /var/www/html/img/

<FilesMatch "\.(css|js|png|jpg|jpeg|gif|svg|webp|ico)$">
    Header set Cache-Control "public, max-age=300"
</FilesMatch>

AliasMatch ^/materias-disponibles/?$ /var/www/html/php/catalogo/materias.php
AliasMatch ^/perfil-tutor/?$ /var/www/html/php/catalogo/perfil-tutor.php
AliasMatch ^/tutores-disponibles/?$ /var/www/html/php/catalogo/tutores.php
AliasMatch ^/horarios-disponibles/?$ /var/www/html/php/catalogo/disponibilidad.php
AliasMatch ^/mi-perfil$ /var/www/html/php/perfil/index.php
AliasMatch ^/mi-perfil-tutor/?$ /var/www/html/php/tutor/mi_perfil.php
AliasMatch ^/mis-materias/?$ /var/www/html/php/tutor/mis_materias.php
AliasMatch ^/materias-ofertadas/?$ /var/www/html/php/tutor/mis_materias.php
AliasMatch ^/materias-ofertadas/seleccionar\.php$ /var/www/html/php/tutor/mis_materias/aplicar.php
AliasMatch ^/materias-ofertadas/horarios\.php$ /var/www/html/php/tutor/mis_materias/horarios.php
AliasMatch ^/materias-ofertadas/cancelar\.php$ /var/www/html/php/tutor/mis_materias/cancelar.php
AliasMatch ^/materias-ofertadas/cancelar\.php$ /var/www/html/php/tutor/mis_materias/cancelar.php
AliasMatch ^/modalidades-grado/?$ /var/www/html/php/mg/index.php
AliasMatch ^/solicitudes/?$ /var/www/html/php/solicitudes/index.php
AliasMatch ^/notificaciones/?$ /var/www/html/php/notificaciones/index.php

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/html/php>
    Options -Indexes
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory /var/www/html/usuarios>
    Options -Indexes
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory /var/www/html/css>
    Options -Indexes
    Require all granted
</Directory>

<Directory /var/www/html/js>
    Options -Indexes
    Require all granted
</Directory>

<Directory /var/www/html/img>
    Options -Indexes
    Require all granted
</Directory>
